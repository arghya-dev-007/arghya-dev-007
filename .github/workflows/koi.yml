name: Draw Git Koi

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate koi
        uses: yalongwastaken/git-koi@main
        with:
          username: arghya-dev-007
          output: koi.gif

      - name: Commit koi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add koi.gif
          git diff --staged --quiet || git commit -m "chore: update koi"
          git push
